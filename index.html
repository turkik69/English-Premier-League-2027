  .topbar-stats { margin-top:8px; gap:8px; justify-content:flex-start; }

  .pitch-row { display:flex; justify-content:space-evenly; gap:6px; flex-wrap:wrap; position:relative; z-index:1; }

  .chip-pos-DEF { background:#2E5D91; }
  .chip-pos-MID { background:#2F7A4F; }
  .chip-pos-FWD { background:#B3423A; }
  .player-chip-name { font-size:10.5px; font-weight:700; color:var(--ink); white-space:nowrap; max-width:70px; overflow:hidden; text-overflow:ellipsis; }
  .player-chip-club { font-size:9px; color:var(--muted); }
  .player-chip-price { font-size:9px; color:var(--gold-700); font-weight:700; }

  .empty-title { font-weight:700; color:var(--ink); font-size:14px; margin:2px 0 0; }

  .mini-btn-danger { color:#B3423A; }

  .captain-note { font-size:11.5px; color:var(--muted); margin:3px 0 0; }

  .history-row { display:flex; align-items:center; gap:8px; padding:7px 2px; }
  .history-gw { width:28px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .history-bar-track { flex:1; height:14px; background:#F1F4F8; border-radius:7px; overflow:hidden; }
  .history-bar-fill { height:100%; background:var(--navy-500); border-radius:7px; }
  .history-pts { font-weight:800; font-size:13px; width:28px; text-align:center; }
  .history-rank { width:44px; }

  .footer-actions { display:flex; justify-content:center; padding:18px 14px 4px; }
  .reset-btn { display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; }
  .reset-confirm { display:flex; gap:8px; align-items:center; }
  .reset-confirm button { font-size:11.5px; padding:5px 10px; border-radius:7px; border:1px solid var(--border); background:#fff; cursor:pointer; }

  .boot-msg { display:flex; align-items:center; justify-content:center; height:100vh; color:#64748B; font-family:'Cairo',sans-serif; font-size:13px; }

/* ============================================================================
   دوال مساعدة
   ============================================================================ */

function fmtMoney(v) {
  return `£${v.toFixed(1)}م`;
}

function useCountdown(deadlineIso) {
  const target = useMemo(() => new Date(deadlineIso).getTime(), [deadlineIso]);
  const [now, setNow] = useState(() => Date.now());
  useEffect(() => {
    const t = setInterval(() => setNow(Date.now()), 1000);
    return () => clearInterval(t);
  }, []);
  const diff = target - now;
  const past = diff <= 0;
  const abs = Math.abs(diff);
  return {
    past,
    days: Math.floor(abs / 86400000),
    hours: Math.floor((abs % 86400000) / 3600000),
    mins: Math.floor((abs % 3600000) / 60000),
    secs: Math.floor((abs % 60000) / 1000),
  };
}

function localKickoff(iso) {
  try {
    return new Date(iso).toLocaleString('ar', {
      weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit',
    });
  } catch {
    return iso;
  }
}

function validateSquad(squad) {
  const errors = [];
  const counts = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  const clubCounts = {};
  let spent = 0;
  squad.forEach((p) => {
    counts[p.pos] += 1;
    spent += p.price;
    clubCounts[p.clubCode] = (clubCounts[p.clubCode] || 0) + 1;
  });
  POSITION_ORDER.forEach((pos) => {
    if (counts[pos] > SQUAD_RULES[pos]) {
      errors.push(`عدد ${POSITION_LABELS[pos]} تجاوز الحد المسموح (${SQUAD_RULES[pos]})`);
    }
  });
  Object.entries(clubCounts).forEach(([club, n]) => {
    if (n > MAX_PER_CLUB) errors.push(`لا يمكن ضم أكثر من ٣ لاعبين من نفس النادي (${club})`);
  });
  if (spent > BUDGET_CAP) {
    errors.push(`الميزانية تجاوزت الحد المسموح بمقدار ${(spent - BUDGET_CAP).toFixed(1)} مليون`);
  }
  return { errors, spent, remaining: BUDGET_CAP - spent, counts };
}

function validateStartingXI(startingIds, squadById) {
  const errors = [];
  const counts = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  startingIds.forEach((id) => {
    const p = squadById[id];
    if (p) counts[p.pos] += 1;
  });
  if (startingIds.length !== 11) {
    errors.push(`التشكيلة الأساسية تحتاج ١١ لاعباً بالضبط (المختار حالياً: ${startingIds.length})`);
  }
  if (counts.GK !== 1) errors.push('اختاري حارس مرمى واحد فقط في التشكيلة الأساسية');
  if (counts.DEF < 3) errors.push('يلزم ٣ مدافعين على الأقل في التشكيلة الأساسية');
  if (counts.DEF > 5) errors.push('لا يمكن أكثر من ٥ مدافعين في التشكيلة الأساسية');
  if (counts.MID > 5) errors.push('لا يمكن أكثر من ٥ لاعبي وسط في التشكيلة الأساسية');
  if (counts.FWD < 1) errors.push('يلزم مهاجم واحد على الأقل في التشكيلة الأساسية');
  if (counts.FWD > 3) errors.push('لا يمكن أكثر من ٣ مهاجمين في التشكيلة الأساسية');
  return { errors, counts };
}

/* ============================================================================
   التخزين — يعمل تلقائياً سواء داخل Claude (window.storage) أو كملف مستقل
   (localStorage) بدون أي إعداد إضافي
   ============================================================================ */

const HAS_CLAUDE_STORAGE = typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
const STATE_KEY = 'fpl:team-state';
const HISTORY_KEY = 'fpl:points-history';

async function storageGet(key) {
  if (HAS_CLAUDE_STORAGE) {
    try {
      const r = await window.storage.get(key);
      return r ? r.value : null;
    } catch {
      return null;
    }
  }
  try {
    return window.localStorage.getItem(key);
  } catch {
    return null;
  }
}
async function storageSet(key, value) {
  if (HAS_CLAUDE_STORAGE) {
    try { await window.storage.set(key, value); } catch (e) { console.error('storage save failed', e); }
    return;
  }
  try { window.localStorage.setItem(key, value); } catch (e) { console.error('storage save failed', e); }
}

async function loadTeamState() {
  const raw = await storageGet(STATE_KEY);
  try { return raw ? JSON.parse(raw) : null; } catch { return null; }
}
async function saveTeamState(state) {
  await storageSet(STATE_KEY, JSON.stringify(state));
}
async function loadHistory() {
  const raw = await storageGet(HISTORY_KEY);
  try { return raw ? JSON.parse(raw) : []; } catch { return []; }
}
async function saveHistory(hist) {
  await storageSet(HISTORY_KEY, JSON.stringify(hist));
}

      setHistory(savedHistory);
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    saveTeamState({ squad, startingIds, captainId, viceCaptainId });
  }, [loaded, squad, startingIds, captainId, viceCaptainId]);

  useEffect(() => {
    if (!loaded) return;
    saveHistory(history);
  }, [loaded, history]);

  const squadById = useMemo(() => Object.fromEntries(squad.map((p) => [p.id, p])), [squad]);
  const squadInfo = useMemo(() => validateSquad(squad), [squad]);
  const xiValidation = useMemo(() => validateStartingXI(startingIds, squadById), [startingIds, squadById]);
  const benchIds = useMemo(() => squad.map((p) => p.id).filter((id) => !startingIds.includes(id)), [squad, startingIds]);

  const handleAdd = useCallback((player) => {
    setSquad((s) => {
      if (s.some((p) => p.id === player.id)) return s;
      if (s.length >= 15) return s;
      return [...s, player];
    });
  }, []);

  const handleRemove = useCallback((id) => {
    setSquad((s) => s.filter((p) => p.id !== id));
    setStartingIds((ids) => ids.filter((i) => i !== id));
    setCaptainId((c) => (c === id ? null : c));
    setViceCaptainId((v) => (v === id ? null : v));
  }, []);

  const handleToggleStart = useCallback((id) => {
    setStartingIds((ids) => {
      if (ids.includes(id)) {
        return ids.filter((i) => i !== id);
      }
      if (ids.length >= 11) return ids;
      return [...ids, id];
    });
  }, []);

  const handleSetCaptain = useCallback((id) => {
    setCaptainId(id);
    setViceCaptainId((v) => (v === id ? null : v));
  }, []);

  const handleSetVice = useCallback((id) => {
    setViceCaptainId(id);
    setCaptainId((c) => (c === id ? null : c));
  }, []);

  const handleAddHistory = useCallback((entry) => {
    setHistory((h) => [...h.filter((e) => e.gw !== entry.gw), entry]);
  }, []);
  const handleRemoveHistory = useCallback((idx) => {
    setHistory((h) => h.filter((_, i) => i !== idx));
  }, []);

  const doReset = () => {
    setSquad([]);
    setStartingIds([]);
    setCaptainId(null);
    setViceCaptainId(null);
    setConfirmReset(false);
  };

  return (
    <div dir="rtl" lang="ar" className="app-root">
      <TopBar
        gw={CURRENT_GW}
        budgetInfo={squadInfo}
        squadCount={squad.length}
        activeTab={activeTab}
        setActiveTab={setActiveTab}
      />

      <div className="content">
        {activeTab === 'pitch' && (
          <PitchView
            squad={squad}
            startingIds={startingIds}
            benchIds={benchIds}
            captainId={captainId}
            viceCaptainId={viceCaptainId}
            xiErrors={squad.length > 0 ? xiValidation.errors : []}
          />
        )}
        {activeTab === 'squad' && (
          <SquadTab
            squad={squad}
            startingIds={startingIds}
            captainId={captainId}
            viceCaptainId={viceCaptainId}
            onAdd={handleAdd}
            onRemove={handleRemove}
            onToggleStart={handleToggleStart}
            onSetCaptain={handleSetCaptain}
            onSetVice={handleSetVice}
            squadInfo={squadInfo}
          />
        )}
        {activeTab === 'gw' && <GameweekTab />}
        {activeTab === 'history' && (
          <HistoryTab history={history} onAdd={handleAddHistory} onRemove={handleRemoveHistory} />
        )}
      </div>

      <div className="footer-actions">
        {confirmReset ? (
          <div className="reset-confirm">
            <span className="muted-text">حذف كل البيانات المحفوظة؟</span>
            <button onClick={doReset} style={{ color: '#B3423A', fontWeight: 700 }}>نعم، احذف</button>
            <button onClick={() => setConfirmReset(false)}>إلغاء</button>
          </div>
        ) : (
          <button className="reset-btn" onClick={() => setConfirmReset(true)}>
            <RotateCcwIcon size={12} /> إعادة تعيين كل البيانات
          </button>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<FPLGameweekTracker />);
</script>
</body>
</html>
