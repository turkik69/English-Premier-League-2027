<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>متتبّع فانتازي الدوري الإنجليزي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap">
<style>
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:#EEF2F7; }
  #root {
    --navy-900:#0B2038; --navy-700:#16345A; --navy-500:#2E5D91;
    --gold-500:#C9963E; --gold-700:#8A651F; --gold-100:#F5E6C8;
    --bg:#EEF2F7; --surface:#FFFFFF; --ink:#142438; --muted:#64748B; --border:#DCE3EC;
    font-family:'Cairo',system-ui,sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; padding-bottom:32px; font-size:14px; line-height:1.6;
  }
  #root button, #root input, #root select { font-family:'Cairo',system-ui,sans-serif; }
  .app-root { max-width:480px; margin:0 auto; }

  .topbar { background:var(--navy-900); color:#fff; padding:12px 14px 0; position:sticky; top:0; z-index:20; border-radius:0 0 18px 18px; box-shadow:0 6px 18px rgba(11,32,56,0.25); }
  .topbar-row { display:flex; align-items:center; justify-content:space-between; }
  .topbar-brand { display:flex; align-items:center; gap:6px; font-weight:700; font-size:14px; color:var(--gold-100); }
  .countdown { display:flex; align-items:center; gap:5px; background:rgba(255,255,255,0.1); padding:4px 9px; border-radius:20px; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
  .countdown-urgent { background:#B3423A; animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.75;} }
  .topbar-stats { margin-top:8px; gap:8px; justify-content:flex-start; }
  .stat-chip { display:flex; align-items:center; gap:5px; font-size:11px; color:#CBD8EA; background:rgba(255,255,255,0.06); padding:4px 8px; border-radius:8px; }
  .stat-chip-action { border:none; cursor:pointer; background:var(--gold-500); color:#3A2A05; font-weight:700; margin-inline-start:auto; }
  .tabbar { display:flex; margin-top:10px; gap:2px; }
  .tab-btn { flex:1; background:none; border:none; color:#9FB2CC; padding:9px 4px; font-size:12.5px; font-weight:600; cursor:pointer; border-bottom:2px solid transparent; }
  .tab-btn-active { color:#fff; border-bottom:2px solid var(--gold-500); }

  .content { padding:14px; }

  .card { background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:12px; margin-bottom:12px; }
  .section-heading { font-weight:700; font-size:13px; color:var(--navy-700); margin:16px 2px 8px; }
  .section-heading:first-child { margin-top:0; }
  .muted-text { color:var(--muted); font-size:12px; }

  .notice-card { display:flex; gap:8px; align-items:flex-start; background:var(--gold-100); border-color:#E8D6A6; color:#5C4415; font-size:12px; }

  .formation-badge { display:inline-block; background:var(--navy-700); color:#fff; font-size:12px; font-weight:700; padding:4px 12px; border-radius:20px; margin-bottom:10px; }

  .alert-box { display:flex; gap:8px; background:#FBEAEA; border:1px solid #F0C7C4; color:#8C2E27; padding:10px 12px; border-radius:12px; font-size:12.5px; margin-bottom:12px; }
  .alert-box > div > div { margin-bottom:2px; }

  .pitch-wrap { border-radius:18px; overflow:hidden; box-shadow:0 10px 26px rgba(11,32,56,0.22); margin-bottom:10px; }
  .pitch { position:relative; background:repeating-linear-gradient(180deg,#2F7A4F 0,#2F7A4F 42px,#357F55 42px,#357F55 84px); padding:20px 8px; display:flex; flex-direction:column; justify-content:space-between; gap:14px; min-height:400px; }
  .pitch-circle { position:absolute; width:84px; height:84px; border:2px solid rgba(255,255,255,0.4); border-radius:50%; top:50%; left:50%; transform:translate(-50%,-50%); }
  .pitch-halfway { position:absolute; top:50%; left:6%; right:6%; border-top:2px solid rgba(255,255,255,0.4); }
  .pitch-row { display:flex; justify-content:space-evenly; gap:6px; flex-wrap:wrap; position:relative; z-index:1; }

  .player-chip { position:relative; display:flex; flex-direction:column; align-items:center; gap:1px; background:#fff; border:none; border-radius:11px; padding:6px 7px; min-width:58px; box-shadow:0 3px 7px rgba(0,0,0,0.28); cursor:pointer; }
  .player-chip-sm { min-width:50px; opacity:0.96; }
  .chip-pos-dot { width:6px; height:6px; border-radius:50%; margin-bottom:1px; }
  .chip-pos-GK { background:#B7791F; }
  .chip-pos-DEF { background:#2E5D91; }
  .chip-pos-MID { background:#2F7A4F; }
  .chip-pos-FWD { background:#B3423A; }
  .player-chip-name { font-size:10.5px; font-weight:700; color:var(--ink); white-space:nowrap; max-width:70px; overflow:hidden; text-overflow:ellipsis; }
  .player-chip-club { font-size:9px; color:var(--muted); }
  .player-chip-price { font-size:9px; color:var(--gold-700); font-weight:700; }
  .armband { position:absolute; top:-7px; inset-inline-start:-7px; width:17px; height:17px; border-radius:50%; background:var(--gold-500); color:#3A2A05; font-size:9.5px; font-weight:800; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.35); }
  .armband-v { background:#CBD5E1; color:#1F2937; }

  .bench-label { font-size:11.5px; font-weight:700; color:var(--muted); margin:2px 4px 6px; }
  .bench-row { display:flex; gap:8px; flex-wrap:wrap; background:#E4E9F0; border-radius:14px; padding:10px; }

  .empty-state { display:flex; flex-direction:column; align-items:center; text-align:center; gap:6px; padding:36px 20px; color:var(--muted); }
  .empty-title { font-weight:700; color:var(--ink); font-size:14px; margin:2px 0 0; }
  .empty-body { font-size:12.5px; max-width:280px; }

  .budget-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .budget-bar-track { height:8px; background:#E4E9F0; border-radius:6px; overflow:hidden; }
  .budget-bar-fill { height:100%; background:var(--navy-500); border-radius:6px; transition:width .3s ease; }
  .budget-positions { display:flex; flex-wrap:wrap; gap:8px; margin-top:9px; }
  .pos-count { font-size:11px; color:var(--muted); background:#F1F4F8; padding:3px 8px; border-radius:8px; }

  .section-toggle { width:100%; display:flex; justify-content:space-between; align-items:center; background:none; border:none; font-weight:700; font-size:13px; color:var(--navy-700); padding:2px 0; cursor:pointer; }
  .add-form { display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .add-form-row { display:flex; gap:8px; }
  .input { border:1px solid var(--border); border-radius:9px; padding:9px 11px; font-size:13px; background:#FBFCFE; flex:1; color:var(--ink); }
  .btn { display:flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:10px; padding:10px; font-size:13px; font-weight:700; cursor:pointer; }
  .btn-primary { background:var(--navy-700); color:#fff; }
  .suggestions { margin-top:12px; }
  .suggestions-label { margin-bottom:6px; }
  .suggestion-chips { display:flex; flex-wrap:wrap; gap:6px; }
  .suggestion-chip { background:#F1F4F8; border:1px solid var(--border); border-radius:8px; padding:6px 9px; font-size:11.5px; color:var(--navy-700); cursor:pointer; font-weight:600; }

  .squad-group { margin-bottom:10px; }
  .squad-group-title { font-size:11.5px; font-weight:700; color:var(--muted); margin:0 2px 6px; }
  .squad-row { display:flex; justify-content:space-between; align-items:center; background:var(--surface); border:1px solid var(--border); border-radius:11px; padding:9px 11px; margin-bottom:6px; }
  .squad-row-main { display:flex; flex-direction:column; gap:1px; }
  .squad-row-name { font-weight:700; font-size:13px; }
  .squad-row-actions { display:flex; gap:5px; align-items:center; }
  .mini-btn { border:1px solid var(--border); background:#fff; color:var(--muted); font-size:11px; font-weight:700; border-radius:8px; padding:5px 8px; cursor:pointer; }
  .mini-btn-active { background:var(--navy-700); color:#fff; border-color:var(--navy-700); }
  .mini-btn-gold.mini-btn-active { background:var(--gold-500); border-color:var(--gold-500); color:#3A2A05; }
  .mini-btn-danger { color:#B3423A; }
  .mini-btn:disabled { opacity:0.4; cursor:not-allowed; }

  .fixture-row { display:flex; justify-content:space-between; align-items:center; padding:8px 2px; border-bottom:1px solid var(--border); }
  .fixture-row:last-child { border-bottom:none; }
  .fixture-teams { display:flex; align-items:center; gap:6px; flex-wrap:wrap; font-size:12px; }
  .fixture-team { padding:3px 8px; border-radius:7px; font-weight:700; }
  .fixture-time { font-size:10.5px; white-space:nowrap; }

  .captain-row { display:flex; gap:10px; padding:9px 2px; border-bottom:1px solid var(--border); }
  .captain-row:last-child { border-bottom:none; }
  .captain-rank { width:20px; height:20px; flex-shrink:0; background:var(--gold-100); color:var(--gold-700); font-size:11px; font-weight:800; border-radius:50%; display:flex; align-items:center; justify-content:center; }
  .captain-name-row { display:flex; gap:6px; align-items:baseline; font-size:13px; }
  .captain-note { font-size:11.5px; color:var(--muted); margin:3px 0 0; }

  .rules-list { margin-top:10px; }
  .rule-item { display:flex; gap:7px; align-items:flex-start; font-size:12px; color:var(--ink); margin-bottom:8px; }
  .rule-item svg { flex-shrink:0; margin-top:2px; color:var(--navy-500); }

  .history-row { display:flex; align-items:center; gap:8px; padding:7px 2px; }
  .history-gw { width:28px; font-size:11.5px; font-weight:700; color:var(--muted); }
  .history-bar-track { flex:1; height:14px; background:#F1F4F8; border-radius:7px; overflow:hidden; }
  .history-bar-fill { height:100%; background:var(--navy-500); border-radius:7px; }
  .history-pts { font-weight:800; font-size:13px; width:28px; text-align:center; }
  .history-rank { width:44px; }

  .footer-actions { display:flex; justify-content:center; padding:18px 14px 4px; }
  .reset-btn { display:flex; align-items:center; gap:5px; background:none; border:none; color:var(--muted); font-size:11.5px; cursor:pointer; }
  .reset-confirm { display:flex; gap:8px; align-items:center; }
  .reset-confirm button { font-size:11.5px; padding:5px 10px; border-radius:7px; border:1px solid var(--border); background:#fff; cursor:pointer; }
</style>
</head>

function h(tag, attrs) {
  var el = document.createElement(tag);

  for (var k in attrs) {
    var v = attrs[k];
    if (v === null || v === undefined || v === false) continue;

    else if (k === 'style' && typeof v === 'object') { for (var sk in v) { if (v[sk] !== undefined) el.style[sk] = v[sk]; } }

    else el.setAttribute(k, v);
  }
  for (var i = 2; i < arguments.length; i++) {
    appendChild(el, arguments[i]);
  }
  return el;
}
function appendChild(el, c) {

  el.appendChild((typeof c === 'string' || typeof c === 'number') ? document.createTextNode(String(c)) : c);
}

/* ============================================================================
   دوال مساعدة
   ============================================================================ */

function fmtMoney(v) { return '£' + v.toFixed(1) + 'م'; }

function computeCountdown() {
  var target = new Date(GW1_DEADLINE_UTC).getTime();
  var diff = target - Date.now();
  var past = diff <= 0;
  var abs = Math.abs(diff);
  return {
    past: past,
    days: Math.floor(abs / 86400000),
    hours: Math.floor((abs % 86400000) / 3600000),
    mins: Math.floor((abs % 3600000) / 60000),
    secs: Math.floor((abs % 60000) / 1000)
  };
}
function countdownText(cd) {
  if (cd.past) return 'الموعد النهائي انتهى';
  return (cd.days > 0 ? cd.days + ' يوم ' : '') +
    String(cd.hours).padStart(2, '0') + ':' + String(cd.mins).padStart(2, '0') + ':' + String(cd.secs).padStart(2, '0');
}

function localKickoff(iso) {
  try {
    return new Date(iso).toLocaleString('ar', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  } catch (e) {
    return iso;
  }
}

function validateSquad(squad) {
  var errors = [];
  var counts = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  var clubCounts = {};
  var spent = 0;
  squad.forEach(function (p) {
    counts[p.pos] += 1;
    spent += p.price;
    clubCounts[p.clubCode] = (clubCounts[p.clubCode] || 0) + 1;
  });
  POSITION_ORDER.forEach(function (pos) {
    if (counts[pos] > SQUAD_RULES[pos]) errors.push('عدد ' + POSITION_LABELS[pos] + ' تجاوز الحد المسموح (' + SQUAD_RULES[pos] + ')');
  });
  Object.keys(clubCounts).forEach(function (club) {
    if (clubCounts[club] > MAX_PER_CLUB) errors.push('لا يمكن ضم أكثر من ٣ لاعبين من نفس النادي (' + club + ')');
  });
  if (spent > BUDGET_CAP) errors.push('الميزانية تجاوزت الحد المسموح بمقدار ' + (spent - BUDGET_CAP).toFixed(1) + ' مليون');
  return { errors: errors, spent: spent, remaining: BUDGET_CAP - spent, counts: counts };
}

function validateStartingXI(startingIds, squadById) {
  var errors = [];
  var counts = { GK: 0, DEF: 0, MID: 0, FWD: 0 };
  startingIds.forEach(function (id) { var p = squadById[id]; if (p) counts[p.pos] += 1; });
  if (startingIds.length !== 11) errors.push('التشكيلة الأساسية تحتاج ١١ لاعباً بالضبط (المختار حالياً: ' + startingIds.length + ')');
  if (counts.GK !== 1) errors.push('اختاري حارس مرمى واحد فقط في التشكيلة الأساسية');
  if (counts.DEF < 3) errors.push('يلزم ٣ مدافعين على الأقل في التشكيلة الأساسية');
  if (counts.DEF > 5) errors.push('لا يمكن أكثر من ٥ مدافعين في التشكيلة الأساسية');
  if (counts.MID > 5) errors.push('لا يمكن أكثر من ٥ لاعبي وسط في التشكيلة الأساسية');
  if (counts.FWD < 1) errors.push('يلزم مهاجم واحد على الأقل في التشكيلة الأساسية');
  if (counts.FWD > 3) errors.push('لا يمكن أكثر من ٣ مهاجمين في التشكيلة الأساسية');
  return { errors: errors, counts: counts };
}

/* ============================================================================
   التخزين — window.storage إن وُجد (داخل Claude)، وإلا localStorage تلقائياً
   ============================================================================ */

var HAS_CLAUDE_STORAGE = (typeof window !== 'undefined') && !!window.storage && typeof window.storage.get === 'function';
var STATE_KEY = 'fpl:team-state';
var HISTORY_KEY = 'fpl:points-history';

function storageGet(key) {
  if (HAS_CLAUDE_STORAGE) {
    return window.storage.get(key).then(function (r) { return r ? r.value : null; }).catch(function () { return null; });
  }
  try { return Promise.resolve(window.localStorage.getItem(key)); } catch (e) { return Promise.resolve(null); }
}
function storageSet(key, value) {
  if (HAS_CLAUDE_STORAGE) {
    return window.storage.set(key, value).catch(function (e) { console.error('storage save failed', e); });
  }
  try { window.localStorage.setItem(key, value); } catch (e) { console.error('storage save failed', e); }
  return Promise.resolve();
}
function loadTeamState() {
  return storageGet(STATE_KEY).then(function (raw) { try { return raw ? JSON.parse(raw) : null; } catch (e) { return null; } });
}
function saveTeamState(state) { return storageSet(STATE_KEY, JSON.stringify(state)); }
function loadHistory() {
  return storageGet(HISTORY_KEY).then(function (raw) { try { return raw ? JSON.parse(raw) : []; } catch (e) { return []; } });
}
function saveHistory(hist) { return storageSet(HISTORY_KEY, JSON.stringify(hist)); }

function setState(patch) {
  for (var k in patch) state[k] = patch[k];
  render();
  if (state.loaded) {
    saveTeamState({ squad: state.squad, startingIds: state.startingIds, captainId: state.captainId, viceCaptainId: state.viceCaptainId });
    saveHistory(state.history);
  }
}

   ============================================================================ */

function addPlayer(player) {
  if (state.squad.some(function (p) { return p.id === player.id; })) return;
  if (state.squad.length >= 15) return;
  setState({ squad: state.squad.concat([player]) });
}
function removePlayer(id) {
  setState({
    squad: state.squad.filter(function (p) { return p.id !== id; }),
    startingIds: state.startingIds.filter(function (i) { return i !== id; }),
    captainId: state.captainId === id ? null : state.captainId,
    viceCaptainId: state.viceCaptainId === id ? null : state.viceCaptainId
  });
}
function toggleStart(id) {
  var ids = state.startingIds;
  if (ids.indexOf(id) !== -1) setState({ startingIds: ids.filter(function (i) { return i !== id; }) });
  else if (ids.length < 11) setState({ startingIds: ids.concat([id]) });
}
function setCaptain(id) { setState({ captainId: id, viceCaptainId: state.viceCaptainId === id ? null : state.viceCaptainId }); }
function setVice(id) { setState({ viceCaptainId: id, captainId: state.captainId === id ? null : state.captainId }); }
function addHistoryEntry(entry) { setState({ history: state.history.filter(function (e) { return e.gw !== entry.gw; }).concat([entry]) }); }
function removeHistoryEntry(idx) { setState({ history: state.history.filter(function (_, i) { return i !== idx; }) }); }
function doReset() { setState({ squad: [], startingIds: [], captainId: null, viceCaptainId: null, confirmReset: false }); }

    rulesKids.push(h('div', { class: 'rules-list' },
      h('p', { class: 'muted-text', style: { marginBottom: '8px' } }, 'المدة: ' + SEASON_INFO.span),
      SEASON_INFO.points.map(function (pt) { return h('div', { class: 'rule-item' }, icon('check', 13), h('span', {}, pt)); })
    ));
  }

  return h('div', {},
    noticeCard,
    h('p', { class: 'section-heading' }, 'مباريات الجولة ' + CURRENT_GW), fixturesCard,
    h('p', { class: 'section-heading' }, 'أفضل خيارات الكابتن'), captainCard,
    h('div', { class: 'card' }, rulesKids)
  );
}

function renderHistoryTab() {
  var gwInput = h('input', { class: 'input', placeholder: 'رقم الجولة', inputmode: 'numeric' });
  var ptsInput = h('input', { class: 'input', placeholder: 'النقاط', inputmode: 'numeric' });
  var rankInput = h('input', { class: 'input', placeholder: 'الترتيب العام (اختياري)' });

  var form = h('form', {
    class: 'add-form',
    onsubmit: function (e) {
      e.preventDefault();
      var gwNum = parseInt(gwInput.value, 10);
      var ptsNum = parseInt(ptsInput.value, 10);
      if (!gwNum || isNaN(ptsNum)) return;
      addHistoryEntry({ gw: gwNum, pts: ptsNum, rank: rankInput.value.trim() || null });
    }
  },
    h('div', { class: 'add-form-row' }, gwInput, ptsInput),
    rankInput,
    h('button', { type: 'submit', class: 'btn btn-primary' }, icon('plus', 15), ' حفظ النتيجة')
  );

  var formCard = h('div', { class: 'card' }, h('p', { class: 'section-toggle', style: { cursor: 'default' } }, 'تسجيل نتيجة جولة'), form);

  var listNode;
  if (state.history.length === 0) {
    listNode = h('div', { class: 'empty-state' }, icon('trophy', 26),
      h('p', { class: 'empty-title' }, 'لا يوجد سجل بعد'),
      h('p', { class: 'empty-body' }, 'بعد انتهاء كل جولة، سجّلي نقاطك هنا لمتابعة أدائك عبر الموسم.'));
  } else {
    var maxPts = Math.max.apply(null, [1].concat(state.history.map(function (e) { return e.pts; })));
    var sorted = state.history.slice().sort(function (a, b) { return a.gw - b.gw; });
    listNode = h('div', { class: 'card' }, sorted.map(function (entry) {
      var idx = state.history.indexOf(entry);
      var row = [
        h('span', { class: 'history-gw' }, 'ج' + entry.gw),
        h('div', { class: 'history-bar-track' }, h('div', { class: 'history-bar-fill', style: { width: (entry.pts / maxPts * 100) + '%' } })),
        h('span', { class: 'history-pts' }, String(entry.pts))
      ];
      if (entry.rank) row.push(h('span', { class: 'muted-text history-rank' }, '#' + entry.rank));
      row.push(h('button', { class: 'mini-btn mini-btn-danger', onclick: function () { removeHistoryEntry(idx); } }, icon('x', 12)));
      return h('div', { class: 'history-row' }, row);
    }));
  }

  return h('div', {}, formCard, listNode);
}

function renderFooter() {
  if (state.confirmReset) {
    return h('div', { class: 'footer-actions' },
      h('div', { class: 'reset-confirm' },
        h('span', { class: 'muted-text' }, 'حذف كل البيانات المحفوظة؟'),
        h('button', { style: { color: '#B3423A', fontWeight: '700' }, onclick: doReset }, 'نعم، احذف'),
        h('button', { onclick: function () { setState({ confirmReset: false }); } }, 'إلغاء')
      )
    );
  }
  return h('div', { class: 'footer-actions' },
    h('button', { class: 'reset-btn', onclick: function () { setState({ confirmReset: true }); } }, icon('rotateCcw', 12), ' إعادة تعيين كل البيانات')
  );
}

function renderActiveTab() {
  if (state.activeTab === 'pitch') return renderPitchTab();
  if (state.activeTab === 'squad') return renderSquadTab();
  if (state.activeTab === 'gw') return renderGameweekTab();
  if (state.activeTab === 'history') return renderHistoryTab();
  return h('div', {});
}

function render() {
  var root = document.getElementById('root');
  root.innerHTML = '';
  root.appendChild(h('div', { class: 'app-root', dir: 'rtl', lang: 'ar' },
    renderTopBar(),
    h('div', { class: 'content' }, renderActiveTab()),
    renderFooter()
  ));
}

/* ============================================================================
   المؤقّت المستقل للعدّ التنازلي — يحدّث نصّاً فقط، بدون إعادة رسم كاملة
   ============================================================================ */
setInterval(function () {
  var textEl = document.getElementById('countdown-text');
  var wrapEl = document.getElementById('countdown-wrap');
  if (!textEl || !wrapEl) return;
  var cd = computeCountdown();
  var urgent = !cd.past && cd.days === 0 && cd.hours < 6;
  textEl.textContent = countdownText(cd);
  wrapEl.className = 'countdown' + (urgent ? ' countdown-urgent' : '');
}, 1000);

/* ============================================================================
   التشغيل
   ============================================================================ */
render(); // ارسمي فوراً بحالة فارغة حتى لا تظهر الصفحة بيضاء أثناء تحميل البيانات المحفوظة
Promise.all([loadTeamState(), loadHistory()]).then(function (results) {
  var saved = results[0], savedHistory = results[1];
  if (saved && saved.squad && saved.squad.length > 0) {
    state.squad = saved.squad;
    state.startingIds = saved.startingIds || [];
    state.captainId = saved.captainId || null;
    state.viceCaptainId = saved.viceCaptainId || null;
  } else {
    state.squad = USER_SQUAD;
    state.startingIds = USER_STARTING_IDS;
    state.captainId = USER_CAPTAIN_ID;
    state.viceCaptainId = USER_VICE_ID;
  }
  state.history = savedHistory || [];
  state.loaded = true;
  render();
}).catch(function (e) {
  console.error('تعذّر تحميل البيانات المحفوظة', e);
  state.loaded = true;
});
</script>
</body>
</html>
